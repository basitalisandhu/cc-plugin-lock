[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cc-plugin-lock"
version = "0.1.0"
description = "Lock file for Claude Code plugins: pins marketplace plugins and skills to content hashes, verifies them before a session loads them, shows a risk-scored diff, and scans a plugin folder before install."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Basit Ali" }]
keywords = [
  "claude-code",
  "claude-code-plugins",
  "plugins",
  "lockfile",
  "supply-chain-security",
  "integrity",
  "skills",
  "mcp",
  "hooks",
  "agent-security",
  "sarif",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
cc-plugin-lock = "cc_plugin_lock.cli:main"

[project.urls]
Homepage = "https://github.com/basitalisandhu/cc-plugin-lock"
Repository = "https://github.com/basitalisandhu/cc-plugin-lock"
Issues = "https://github.com/basitalisandhu/cc-plugin-lock/issues"
Changelog = "https://github.com/basitalisandhu/cc-plugin-lock/blob/main/CHANGELOG.md"
Documentation = "https://github.com/basitalisandhu/cc-plugin-lock/blob/main/docs/lockfile.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_plugin_lock"]

[tool.hatch.build.targets.sdist]
include = [
  "src/cc_plugin_lock/**",
  "examples/**",
  "docs/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
